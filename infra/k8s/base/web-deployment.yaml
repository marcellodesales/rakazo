apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: rakazo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: rakazo
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/marcellodesales/rakazo/web:edge
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@rakazo/web"
            - preview
            - --host
            - 0.0.0.0
            - --port
            - "5173"
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: rakazo-config
                  key: NODE_ENV
            - name: API_PROXY_TARGET
              valueFrom:
                configMapKeyRef:
                  name: rakazo-config
                  key: API_PROXY_TARGET
            - name: RAKAZO_HOST
              valueFrom:
                configMapKeyRef:
                  name: rakazo-config
                  key: RAKAZO_HOST
            - name: SCREEN_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-runtime-secrets
                  key: SCREEN_PROXY_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
