name: "🐳 docker-multiarch-cicd-web"
run-name: "🐳 docker-multiarch-cicd-web · ${{ github.event_name }} · ${{ github.ref_name }}"
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    tags: ['v*']

concurrency:
  group: docker-multiarch-cicd-web-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-multiarch-web:
    uses: ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    with:
      registry: ghcr.io
      platforms: linux/amd64,linux/arm64
      docker-compose-file-name: infra/compose/docker-compose.cicd.yml
      docker-compose-target-service: web
      push-attestations: 'false'
